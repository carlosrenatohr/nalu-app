name: Desplegar

on:
  push:
    branches: [main]
  workflow_dispatch:

# Solo despliega si hay credenciales de Cloudflare configuradas en los
# secretos del repositorio (CLOUDFLARE_API_TOKEN y CLOUDFLARE_ACCOUNT_ID).
jobs:
  quality:
    name: Calidad
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  deploy:
    name: Desplegar a Cloudflare Workers
    needs: quality
    runs-on: ubuntu-latest
    # Condicional: solo si las credenciales de producción están configuradas
    if: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Aplica las migraciones a la base D1 de producción
      - name: Aplicar migraciones D1 (producción)
        working-directory: backend
        run: pnpm exec wrangler d1 migrations apply nalu-db --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Construye el frontend y despliega API + estáticos en un solo Worker
      - name: Construir frontend
        working-directory: frontend
        run: pnpm run build

      - name: Desplegar Worker
        working-directory: backend
        run: pnpm exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
