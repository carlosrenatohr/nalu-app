name: Desplegar

on:
  push:
    branches: [main]
  workflow_dispatch:

# Solo despliega si hay credenciales de Cloudflare configuradas en los
# secretos del repositorio (CLOUDFLARE_API_TOKEN y CLOUDFLARE_ACCOUNT_ID).
# Nota: los `secrets` no se pueden referenciar en `if:`; se exponen como
# variables de entorno del job y se comparan con `env.*` en cada step.
jobs:
  quality:
    name: Calidad
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  deploy:
    name: Desplegar a Cloudflare Workers
    needs: quality
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Si no hay credenciales, avisamos y el resto de steps se omite.
      - name: Sin credenciales de Cloudflare
        if: ${{ env.CLOUDFLARE_API_TOKEN == '' || env.CLOUDFLARE_ACCOUNT_ID == '' }}
        run: echo "::warning::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID no configurados — se omite el despliegue"

      # Aplica las migraciones a la base D1 de producción
      - name: Aplicar migraciones D1 (producción)
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' }}
        working-directory: backend
        run: pnpm exec wrangler d1 migrations apply nalu-db --remote

      # Construye el frontend y despliega API + estáticos en un solo Worker
      - name: Construir frontend
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' }}
        working-directory: frontend
        run: pnpm run build

      - name: Desplegar Worker
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' }}
        working-directory: backend
        run: pnpm exec wrangler deploy
